# Starship Configuration for DOTMOD
# Visual themes support via palettes
palette = "tokyo_night"

format = """
[┌───────────────────>](bold color_frame)
[│](bold color_frame) $all
[└─>](bold color_frame) """

[character]
success_symbol = "[➜](bold color_char)"
error_symbol = "[✗](bold color_err)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold color_dir"

[git_branch]
symbol = " "
style = "bold color_git"

[git_status]
style = "bold color_err"

[palettes.tokyo_night]
color_frame = "#7aa2f7"
color_char  = "#9ece6a"
color_err   = "#f7768e"
color_dir   = "#7dcfff"
color_git   = "#bb9af7"

