# Starship Configuration for DOTMOD
# Catppuccin Mocha theme inspired
format = """
[┌───────────────────>](bold green)
[│](bold green) $all
[└─>](bold green) """

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"

[directory]
truncation_length = 3
truncation_symbol = "…/"
style = "bold cyan"

[git_branch]
symbol = " "
style = "bold purple"

[git_status]
style = "bold red"
